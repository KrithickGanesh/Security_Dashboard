# Render Blueprint - single service that serves the SPA and the API.
#
# Usage: Render Dashboard -> New -> Blueprint -> select this repository.
# After provisioning, set MONGO_URI and CLIENT_URL in the dashboard.
#
# CLIENT_URL must be the service's own public URL, e.g.
#   https://devsecops-dashboard.onrender.com

services:
  - type: web
    name: devsecops-dashboard
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: TRUST_PROXY
        value: "1"
      # Same origin -> strict cookies are correct and safest.
      - key: COOKIE_SAME_SITE
        value: strict
      - key: COOKIE_SECURE
        value: "true"
      # MongoDB Atlas connection string (set manually).
      - key: MONGO_URI
        sync: false
      # This service's own public URL (set manually after first deploy).
      - key: CLIENT_URL
        sync: false
      # Generated once by Render and kept secret.
      - key: JWT_SECRET
        generateValue: true
