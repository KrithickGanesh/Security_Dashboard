services:
  mongodb:
    image: mongo:7.0
    container_name: devsecops_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: devsecops_dashboard
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devsecops_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/devsecops_dashboard
      JWT_SECRET: devsecops_jwt_secret_key_production_32chars_min
      JWT_REFRESH_SECRET: devsecops_jwt_refresh_secret_production_32chars
      CLIENT_URL: http://localhost
      # Compose serves over plain HTTP, so Secure cookies would be dropped.
      COOKIE_SECURE: "false"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: devsecops_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
